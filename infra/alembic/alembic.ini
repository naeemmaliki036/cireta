# Alembic Configuration

[alembic]
# Path to migration scripts
script_location = .

# Template for new migration files
file_template = %%(rev)s_%%(slug)s

# Prepend date to migration file names
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run in "offline" mode (no database connection needed)
# offline = false

# SQL output encoding
output_encoding = utf-8

# SQLAlchemy URL - overridden by env.py from environment variable
sqlalchemy.url = postgresql://cireta:cireta@localhost:5435/cireta

[post_write_hooks]
# Run black/ruff formatting on new migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
