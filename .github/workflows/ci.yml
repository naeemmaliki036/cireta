name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: API Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cireta
          POSTGRES_PASSWORD: cireta
          POSTGRES_DB: cireta_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry==1.8.2
      - name: Install dependencies
        run: poetry install --no-root
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://cireta:cireta@localhost:5432/cireta_test
          JWT_SECRET_KEY: test-secret-key-for-ci
          SUMSUB_TOKEN: test-placeholder
        run: poetry run pytest apps/api/tests/ -v --tb=short

  contract-tests:
    name: Smart Contract Tests (Hardhat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test

  launchpad-build:
    name: Launchpad Build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/launchpad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run build --workspace=apps/launchpad
        working-directory: .
        env:
          NEXT_PUBLIC_API_URL: https://api-production-082c.up.railway.app

  admin-build:
    name: Admin Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build --workspace=apps/admin
        env:
          NEXT_PUBLIC_API_URL: https://api-production-082c.up.railway.app
