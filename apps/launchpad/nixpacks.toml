providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["cd /app && npm ci"]

[phases.build]
cmds = ["cd /app && npm run build --workspace=apps/launchpad"]

[start]
cmd = "PORT=${PORT:-3000} HOSTNAME=0.0.0.0 node /app/apps/launchpad/.next/standalone/apps/launchpad/server.js"
